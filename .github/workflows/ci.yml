name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: mos, POSTGRES_PASSWORD: mos, POSTGRES_DB: marketingos_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U mos" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check app tests
      - name: Tests (SQLite)
        run: pytest -q
      - name: Migrations match the models
        run: alembic upgrade head && alembic check
        env: { DATABASE_URL: "postgresql+psycopg://mos:mos@localhost:5432/marketingos_test" }
      - name: Tests (PostgreSQL)
        run: pytest -q
        env: { DATABASE_URL: "postgresql+psycopg://mos:mos@localhost:5432/marketingos_test" }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next build

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
